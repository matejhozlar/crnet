name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Get version
        id: version
        run: echo "value=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish artifacts
        run: ./gradlew publish

      - name: Push to Maven repo
        run: |
          git clone https://Claude:${{ secrets.MAVEN_REPO_TOKEN }}@gitea.matejhoz.com/matejhozlar/maven.git maven-repo
          cp -r build/maven-publish/. maven-repo/
          cd maven-repo
          git config user.email "ci@createrington.com"
          git config user.name "CI"
          git add .
          git diff --cached --quiet || git commit -m "publish crnet ${{ steps.version.outputs.value }}"
          git push

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          version: ${{ steps.version.outputs.value }}
          version-type: beta
          name: "[${{ steps.version.outputs.value }}] CRNet"
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: 1.21.1
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          java: 21

          curseforge-id: 1509069
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
